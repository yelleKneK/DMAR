url: https://yelleknek.github.io/DMAR

template:
  bootstrap: 5
  bslib:
    primary: "#0c2340"     # Notre Dame navy
    secondary: "#d39f10"   # Bright gold
    border-radius: 0.5rem

home:
  title: "DMAR: Design, Measurement, and Analysis in R"
  description: >
    Design, measurement, and analysis in R, with emphasis on methods for
    human-centered research. Effect sizes reported with confidence intervals,
    sample size planning by power analysis and by accuracy in parameter
    estimation (AIPE), reliability and measurement, mediation analysis with
    model comparison inference, equivalence testing, meta-analysis, and tidy
    output. A more modern, more general, and greatly expanded reimagining of MBESS.

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

articles:
- title: Start here
  navbar: ~
  contents:
  - DMAR
  - dmar_output
